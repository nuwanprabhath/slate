name: Verify

# The whole gate, in one place, so a push, a pull request and a release tag all run exactly the same jobs.
# Called by ci.yml (push and pull_request) and by release.yml's verify job (a v* tag); it has no trigger of
# its own. Review F4: v0.6.7 was published from a commit whose Ubuntu e2e job had failed, because the release
# workflow ran only typecheck and the unit and main-process tests.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and guards (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet compares the exception lists with main, so it needs main's history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Also installs tools/lint (postinstall).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run guards
        env:
          SLATE_BASE_REF: origin/main
          # Review F9: the machine-readable results the evidence job checks the trace matrix against.
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/vitest-guards.json
      # Audit C11 criterion 2: every finding has a test and the committed matrix matches the test titles.
      - name: Traceability (docs/compliance/traceability.yaml)
        run: node scripts/traceability.mjs --check
      # The backstop for what the guard-edits hook cannot see in a shell command.
      - name: Guard files change only in Guardrail-Change commits
        run: node scripts/agents/check-guard-commits.mjs
        env:
          SLATE_BASE_REF: origin/main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-lint
          # A job that failed before its runner wrote anything has nothing to upload; the evidence job
          # then fails on the ids whose report is missing, which is the message worth reading.
          if-no-files-found: ignore
          path: test-reports/

  test-linux:
    name: Typecheck, tests and e2e (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Electron's system libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxshmfence1
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox prefers. Keep that block, as on a
      # user's machine, and make chrome-sandbox setuid root as the .deb's after-install does: Chromium then
      # runs the setuid sandbox, whose renderers are non-dumpable (T-ZERO-06 asserts both).
      - name: Electron's setuid sandbox, as the .deb installs it
        # npm ci does not fetch Electron's binary on this runner (it downloads on first launch), so chrome-sandbox
        # does not exist yet: fetch it first.
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      # Audit C3: the notes database is SQLCipher inside @slate/native, so the main-process tests and
      # e2e need the addon. The FIPS provider too: the fips-140-3 profile tests (C5, C9 R-3) need it
      # active. Built exactly as in the native job (pinned tarballs, --update-pin as there).
      - name: Build @slate/native (libcrypto, FIPS Provider 3.1.2, SQLCipher, addon)
        run: |
          npm run -w @slate/native build:openssl -- --update-pin
          npm run -w @slate/native build:sqlcipher
          npm run -w @slate/native build:addon
      - run: npm run typecheck
      - run: npm test
        env:
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/vitest-unit-linux.json
      - run: npm run test:main
        env:
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/vitest-main-linux.json
      - name: E2E (virtual display)
        run: xvfb-run --auto-servernum npm run e2e
        env:
          # Review F9: scripts/e2e.mjs gives each Playwright pass its own file (…-parallel-os-shared, …-perf).
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/playwright-e2e.json
          # A shared runner with no GPU: perf.spec.ts scales its budgets by this (see the spec).
          SLATE_PERF_FACTOR: 1.5
          # perf-diagnose.spec.ts prints where typing time goes on this runner.
          SLATE_PERF_TRACE: 1
          # xvfb is a virtual display nobody sees, so the window can be shown there (see src/main/index.ts).
          SLATE_E2E_SHOW: 1
      # Audit §6.3 T-ZERO-04 and T-ZERO-06 (C7). The suite above already ran with the app non-dumpable
      # (Z-9), so Chromium's children start that way. Here: after a lock no key or password is left in the
      # main process (memscan reads /proc/<pid>/mem through passwordless sudo; the app runs as this user),
      # and a crash leaves no core file although the shell allows one.
      - name: Memory evidence (T-ZERO-04, T-ZERO-06)
        working-directory: packages/desktop
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/slate-core.%p
          ulimit -c unlimited
          xvfb-run --auto-servernum npx playwright test --config playwright.linux.config.ts
          test -z "$(ls /tmp/slate-core.* 2>/dev/null)"
        env:
          SLATE_E2E_SHOW: 1
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/playwright-linux.json
      # Playwright hides the app's own output, so a launch that hangs shows only timeouts. Start it
      # once by hand and print what Electron and the main process said.
      - name: App startup log
        if: failure()
        working-directory: packages/desktop
        run: |
          SLATE_E2E=1 SLATE_USER_DATA="$(mktemp -d)" ELECTRON_ENABLE_LOGGING=1 \
            timeout 25 xvfb-run --auto-servernum npx electron out/main/index.js 2>&1 | tail -100 || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: packages/desktop/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-linux
          # A job that failed before its runner wrote anything has nothing to upload; the evidence job
          # then fails on the ids whose report is missing, which is the message worth reading.
          if-no-files-found: ignore
          path: test-reports/

  test-mac:
    name: Unit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @slate/native's SQLCipher tests need the addon, and the fips-140-3 profile tests the FIPS
      # provider: built as in the native job (pinned tarballs, --update-pin as there).
      - name: Build @slate/native (libcrypto, FIPS Provider 3.1.2, SQLCipher, addon)
        run: |
          npm run -w @slate/native build:openssl -- --update-pin
          npm run -w @slate/native build:sqlcipher
          npm run -w @slate/native build:addon
      - run: npm test
        env:
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/vitest-unit-mac.json
      # Audit §6.1: the main-process layer runs on darwin-arm64 as well as linux-x64.
      - run: npm run test:main
        env:
          SLATE_TEST_REPORT: ${{ github.workspace }}/test-reports/vitest-main-mac.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-mac
          # A job that failed before its runner wrote anything has nothing to upload; the evidence job
          # then fails on the ids whose report is missing, which is the message worth reading.
          if-no-files-found: ignore
          path: test-reports/

  native:
    # Audit C2: @slate/native per prebuild target. OpenSSL 3.5.x and the FIPS Provider 3.1.2 are
    # built from the SHA-256-pinned tarballs in packages/native/deps.lock.json.
    name: Native module (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Electron's system libraries (it runs the main-process tests as Node)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64
      - run: npm ci
      # --update-pin: CI reports this runner's provider digest (in the uploaded fips-digest.json) for the
      # maintainer to review and commit. The release never updates the pin (review M4).
      - name: Build OpenSSL 3.5.x (libcrypto) and the FIPS Provider 3.1.2
        run: npm run -w @slate/native build:openssl -- --update-pin
      - name: Build the SQLCipher amalgamation (pinned tarball and amalgamation digest)
        run: npm run -w @slate/native build:sqlcipher
      - name: Build slate_native.node
        run: npm run -w @slate/native build:addon
      - name: Symbol-export check (criterion 1)
        run: npm run -w @slate/native check:exports
      # --report: the PASS/FAIL lines of test/kat.c as JSON, so the evidence job can see that T-ZERO-03 and the
      # other check("…") names ran and passed here (review F9).
      - name: Native KATs (B.1a, T-ZERO-03)
        run: npm run -w @slate/native test:kat -- --report ${{ github.workspace }}/test-reports/kat-${{ matrix.target }}.json
      - name: Native KATs under ASan/UBSan
        run: npm run -w @slate/native test:kat:asan
      - name: Native KATs through the FIPS provider
        run: node packages/native/scripts/kat.mjs --fips --report ${{ github.workspace }}/test-reports/kat-fips-${{ matrix.target }}.json
      - name: T-KAT-01 cross-implementation vectors
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl" npm run -w @slate/native test:crosscheck
      - name: Addon round trip and T-POST-06 under ELECTRON_RUN_AS_NODE
        run: npm run test:main -- src/main/native
      - name: SQLCipher in the module (T-DB-01..03), in FIPS mode
        run: |
          SLATE_TEST_REPORT="$GITHUB_WORKSPACE/test-reports/vitest-native-${{ matrix.target }}.json" npx vitest run --project native
          SLATE_TEST_REPORT="$GITHUB_WORKSPACE/test-reports/vitest-db-${{ matrix.target }}.json" npm run test:main -- src/main/db
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-native-${{ matrix.target }}
          # A job that failed before its runner wrote anything has nothing to upload; the evidence job
          # then fails on the ids whose report is missing, which is the message worth reading.
          if-no-files-found: ignore
          path: test-reports/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          path: |
            packages/native/prebuilds/${{ matrix.target }}/slate_native.node
            packages/native/fips/${{ matrix.target }}/
            packages/native/fips-digest.json

  # Review F9: the trace matrix only matched finding ids to test titles, so a test that was skipped, or that no
  # job ran, still looked traced. This job reads the reports every job above wrote and fails unless each traced
  # id has a PASSING result on this commit. Its output is the release's evidence file: commit, job, id, status,
  # with the ids no CI job can run in their own MANUAL table against the release-checklist step that covers each.
  evidence:
    name: Traced tests ran and passed
    needs: [lint, test-linux, test-mac, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The check parses the suite's test titles as well as the reports, so it needs the lint toolchain's
      # TypeScript parser (tools/lint, installed by postinstall).
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-reports-*
          path: test-reports
          merge-multiple: true
      - name: Every traced test id passed in this run
        run: node scripts/traceability.mjs --verify-run test-reports/*.json --out traceability-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability-evidence
          if-no-files-found: error
          path: traceability-evidence.json
