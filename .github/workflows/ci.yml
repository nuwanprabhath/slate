name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Signing is optional: without these secrets the build is unsigned.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SLATE_UPDATE_URL: ${{ vars.SLATE_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:main
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - name: E2E (macOS)
        if: runner.os == 'macOS'
        run: npm run e2e
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
