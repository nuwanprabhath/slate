name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Typecheck, tests and e2e (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Electron's system libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxshmfence1
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:main
      - name: E2E (virtual display)
        run: xvfb-run --auto-servernum npm run e2e
        env:
          # A shared runner with no GPU: perf.spec.ts scales its budgets by this (see the spec).
          SLATE_PERF_FACTOR: 1.5
          # perf-diagnose.spec.ts prints where typing time goes on this runner.
          SLATE_PERF_TRACE: 1
      # Playwright hides the app's own output, so a launch that hangs shows only timeouts. Start it
      # once by hand and print what Electron and the main process said.
      - name: App startup log
        if: failure()
        working-directory: packages/desktop
        run: |
          SLATE_E2E=1 SLATE_USER_DATA="$(mktemp -d)" ELECTRON_ENABLE_LOGGING=1 \
            timeout 25 xvfb-run --auto-servernum npx electron out/main/index.js 2>&1 | tail -100 || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: packages/desktop/test-results/
          if-no-files-found: ignore

  test-mac:
    name: Unit tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
