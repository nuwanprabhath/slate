name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job lives in the reusable workflow, which release.yml calls too (review F4).
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
