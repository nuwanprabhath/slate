name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The cheap checks, before any runner builds anything: the tag names the committed version, and the tagged
  # commit is on main. Review F4: a tag on a side branch or a rewritten commit never passed main's protected,
  # CI-gated history, so it must not be releasable.
  gate:
    name: Gate the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge-base needs main's history, which a tag checkout does not bring on its own.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tagged commit is an ancestor of origin/main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main: a tag is releasable only on main's history"
            exit 1
          fi
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./package.json').version")"
          desktop="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$tag" != "$root" ] || [ "$tag" != "$desktop" ]; then
            echo "::error::tag v$tag does not match package.json ($root) and packages/desktop/package.json ($desktop)"
            exit 1
          fi

  # The same gate a push runs: lint, guards, traceability, the guard-commit check, unit, main-process, Linux e2e,
  # the memory evidence and the native matrix. Nothing below starts until it is green.
  verify:
    name: Verify
    needs: gate
    uses: ./.github/workflows/verify.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [gate, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            script: dist:mac:arm64
          - name: Linux x64
            os: ubuntu-24.04
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      # D-1: package signing is off until the maintainer adds the secret; only a yes/no reaches the job.
      HAS_LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      # Audit C2: OpenSSL 3.5.x, the FIPS Provider 3.1.2 (CMVP #4985) and slate_native.node for this
      # runner's target, from the SHA-256-pinned tarballs; electron-builder refuses to package without them.
      - name: Build @slate/native (OpenSSL, FIPS provider, SQLCipher, addon)
        run: npm run -w @slate/native build
      # Review M4: the provider must equal the committed, reviewed pin; the build refuses a mismatch and
      # this proves the pin file was not rewritten.
      - name: Provider matches the committed pin
        run: git diff --exit-code packages/native/fips-digest.json
      - name: Symbol-export check
        run: npm run -w @slate/native check:exports
      - name: Native KATs through the FIPS provider
        run: node packages/native/scripts/kat.mjs --fips
      # Never look for a signing identity in the keychain. D-1: a Developer ID certificate and Apple
      # notarisation credentials switch signing on (electron-builder.cjs); while the secrets are empty
      # the mac build stays ad-hoc signed.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # T-B-07: the shipped binary's fuses are the ones electron-builder.cjs asks for.
      - name: Check the release fuses
        run: |
          if [ "$RUNNER_OS" = macOS ]; then app=packages/desktop/release/mac-arm64/Slate.app; else app=packages/desktop/release/linux-unpacked/slate; fi
          node scripts/check-fuses.mjs "$app" packages/desktop/electron-builder.cjs
      # Review R1: the packaged binary itself (signed and hardened when D-1 is on) starts the shipped
      # slate_native.node on the shipped resources/fips in approved mode. Signing that rewrote the
      # provider (SCC_15) or library validation refusing it (SCC_6) fails here, before publishing.
      - name: Packaged app starts the FIPS module in approved mode
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            exe=packages/desktop/release/mac-arm64/Slate.app/Contents/MacOS/Slate
            res=packages/desktop/release/mac-arm64/Slate.app/Contents/Resources
          else
            exe=packages/desktop/release/linux-unpacked/slate
            res=packages/desktop/release/linux-unpacked/resources
          fi
          ELECTRON_RUN_AS_NODE=1 "$exe" packages/desktop/scripts/smoke-native.cjs "$res"
      - name: List the .deb in latest-linux.yml
        if: runner.os == 'Linux'
        run: node scripts/add-deb-to-latest.mjs packages/desktop/release
      # D-1: detached OpenPGP signatures for the Linux packages, once LINUX_SIGNING_KEY exists.
      - name: Sign the Linux packages
        if: runner.os == 'Linux' && env.HAS_LINUX_SIGNING_KEY == 'true'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
          for f in packages/desktop/release/*.deb packages/desktop/release/*.AppImage; do
            gpg --batch --yes --armor --detach-sign --output "$f.asc" "$f"
          done
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && env.HAS_LINUX_SIGNING_KEY == 'true'
        with:
          name: release-package-signatures-${{ matrix.os }}
          if-no-files-found: error
          path: packages/desktop/release/*.asc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/latest-linux.yml
      # The provider digest this build pinned into the main bundle (POST-MODULE-STATUS compares against it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-digest-${{ matrix.os }}
          if-no-files-found: error
          path: packages/native/fips-digest.json

  # Its own job, with no secrets: npx fetches cyclonedx-npm's dependency tree, and none of that code
  # may share a runner with the signing key (releaseConfig.test.ts checks this file for it).
  sbom:
    name: Software bill of materials (CycloneDX)
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # FPT_LIB_EXT.1 / SR-4(4): every npm package with its version and SHA-512 from package-lock.json;
      # the native components join through scripts/sbom-add-native.mjs once the native build lists them.
      - run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --output-format JSON --output-file sbom/slate-sbom.cdx.json
          node scripts/sbom-add-native.mjs sbom/slate-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          if-no-files-found: error
          path: sbom/slate-sbom.cdx.json

  publish:
    name: Publish the GitHub release
    needs: [gate, verify, build, sbom]
    runs-on: ubuntu-24.04
    # The signing key is a secret of the `release` environment, which only `v*` tags can deploy to.
    environment: release
    permissions:
      contents: write
    steps:
      # Only checked-in scripts run here, under plain node, and only pinned actions: no npm or npx
      # in the job that holds the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 (OpenSSL 3.5) here only: the signer makes ML-DSA-65 signatures, which Node 22 cannot.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only the build jobs' artefacts go where the signer signs; the SBOM job ran third-party code,
      # so its artefact lands apart and only the one SBOM file is copied across.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom-artifact
      # Review F9: verify.yml's evidence job wrote it from this run's own test reports, so the release carries
      # proof that each traced test id passed on this commit (and which ids a person had to run instead).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: traceability-evidence
          path: evidence-artifact
      - name: Both update feeds are present
        run: test -f dist/latest-mac.yml && test -f dist/latest-linux.yml
      - name: Copy the SBOM, and nothing else, from the SBOM job
        run: cp sbom-artifact/slate-sbom.cdx.json dist/slate-sbom.cdx.json
      - name: Copy the traceability evidence, and check it is this tag's commit
        run: |
          cp evidence-artifact/traceability-evidence.json dist/traceability-evidence.json
          node -e "const e = require('./dist/traceability-evidence.json'); if (e.commit !== process.env.GITHUB_SHA) { console.error('::error::traceability-evidence.json is for ' + e.commit + ', not ' + process.env.GITHUB_SHA); process.exit(1) }"
      - name: The signing runtime has OpenSSL 3.5 or later (ML-DSA-65)
        run: |
          node -p "process.versions.node + ' OpenSSL ' + process.versions.openssl"
          node -e "const [a, b] = process.versions.openssl.split('.').map(Number); if (a < 3 || (a === 3 && b < 5)) { console.error('OpenSSL ' + process.versions.openssl + ' < 3.5: cannot sign ML-DSA-65'); process.exit(1) }"
      # Offline signatures the app checks before it offers, downloads or installs an update
      # (packages/desktop/src/main/update/signature.ts): <file>.sig (Ed25519, clients up to 0.3.x) and
      # <file>.pq.sig (ml-dsa-65+ed25519). Fails the release when either secret is missing or the runtime
      # cannot sign ML-DSA-65; dist/*.sig below uploads both.
      - name: Sign the update feeds and artefacts
        env:
          SLATE_UPDATE_SIGNING_KEY: ${{ secrets.SLATE_UPDATE_SIGNING_KEY }}
          SLATE_UPDATE_SIGNING_KEY_MLDSA: ${{ secrets.SLATE_UPDATE_SIGNING_KEY_MLDSA }}
        run: node scripts/sign-update.mjs dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Slate ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest-mac.yml
            dist/latest-linux.yml
            dist/*.sig
            dist/slate-sbom.cdx.json
            dist/traceability-evidence.json
      - name: Attach the Linux package signatures
        if: hashFiles('dist/*.asc') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.asc --repo "$GITHUB_REPOSITORY"
