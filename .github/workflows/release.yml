name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag and the tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root="$(node -p "require('./package.json').version")"
          desktop="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$tag" != "$root" ] || [ "$tag" != "$desktop" ]; then
            echo "::error::tag v$tag does not match package.json ($root) and packages/desktop/package.json ($desktop)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:main

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            script: dist:mac:arm64
          - name: Linux x64
            os: ubuntu-24.04
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      # Unsigned: stop electron-builder from looking for a signing identity in the keychain.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List the .deb in latest-linux.yml
        if: runner.os == 'Linux'
        run: node scripts/add-deb-to-latest.mjs packages/desktop/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/latest-linux.yml

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Both update feeds are present
        run: test -f dist/latest-mac.yml && test -f dist/latest-linux.yml
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: Slate ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest-mac.yml
            dist/latest-linux.yml
