name: Nightly

# Audit §6.1 layers that are too slow for every push (C11): the fuzz soak, and the Linux memory evidence with its
# scan report kept as an artefact. Also on release tags. release.yml does not wait for this workflow, so nothing
# blocks a release automatically: a red run on a tag is for the maintainer to act on (audit §6.1 asks for a block).
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-soak:
    name: Fuzz soak (every Fuzz and Model file, 200,000 runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Electron's system libraries (it runs the main-process tests as Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64
      - run: npm ci
      - name: Build @slate/native (libcrypto, SQLCipher, addon)
        run: |
          npm run -w @slate/native build:openssl -- --only openssl
          npm run -w @slate/native build:sqlcipher
          npm run -w @slate/native build:addon
      # A new seed every night (the run number), so the soak explores beyond CI's fixed 0x51a7e; a failure prints
      # the seed and fast-check's shrunk counterexample, which becomes a fixed case in the same file. The kit
      # (packages/desktop/test/fuzz.ts) reads these, and fcRuns(divisor) scales with SLATE_FUZZ_RUNS, so every
      # file runs 100x its PR depth here: F4d's private-box model and F2d's sync-over-store model among them.
      - name: Fuzz soak (core, editor, sync, importer, mcp, desktop unit)
        # 200k runs per property take minutes, not vitest's default 5 s per test.
        run: npx vitest run --testTimeout=1800000 Fuzz.test Model.test privateCanary simulationFaults
        env:
          SLATE_FUZZ_RUNS: 200000
          SLATE_SIM_RUNS: 20000
          SLATE_FUZZ_SEED: ${{ github.run_number }}
      - name: Fuzz soak (main process)
        run: npm run test:main -- --testTimeout=1800000 Fuzz.test Model.test privateCanaryStateful src/main/vault/fuzz.test.ts src/main/vault/envelope2.test.ts src/main/vault/localJsonCaps.test.ts
        env:
          SLATE_FUZZ_RUNS: 200000
          SLATE_SIM_RUNS: 20000
          SLATE_FUZZ_SEED: ${{ github.run_number }}

  fuzz-native:
    name: Native libFuzzer (${{ matrix.harness }}, 10 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness: [recovery, gcm, wrap, ops, mldsa]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # On ubuntu-24.04, clang-18's libFuzzer runtime (libclang_rt.fuzzer) is in libclang-rt-18-dev. fuzz.mjs
      # compiles with `cc`, so clang goes first on PATH under that name.
      - name: Install clang and its libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          mkdir -p "$RUNNER_TEMP/cc"
          ln -s "$(command -v clang-18)" "$RUNNER_TEMP/cc/cc"
          echo "$RUNNER_TEMP/cc" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build libcrypto
        run: npm run -w @slate/native build:openssl -- --only openssl
      - name: Restore the evolving corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packages/native/build/fuzz/corpus-${{ matrix.harness }}
          key: fuzz-native-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: fuzz-native-${{ matrix.harness }}-
      - name: libFuzzer (the committed corpus plus the cached one)
        run: npm run -w @slate/native fuzz -- --harness ${{ matrix.harness }} --seconds 600
      # A crash input is a working reproducer and a public repository's artefacts are downloadable, so only the
      # sanitizer log (in the job log) and each input's SHA-256 leave the runner (plan section 2.5).
      - name: Crash input hashes
        if: failure()
        run: sha256sum packages/native/build/fuzz/crashes-${{ matrix.harness }}/* > "$RUNNER_TEMP/crash-sha256.txt" || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-native-${{ matrix.harness }}
          path: ${{ runner.temp }}/crash-sha256.txt
          retention-days: 30

  fuzz-converter:
    name: one2html black-box fuzz (F3d)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust nightly (for the one2html converter)
        run: rustup toolchain install nightly --profile minimal
      - run: npm run build:one2html
      # The real converter over mutated .one files, never yet run against the binary: this answers whether M4
      # was reachable through one2html. The budget stops new runs inside the job's slot.
      - name: Fuzz one2html
        run: node packages/desktop/scripts/fuzz-one2html.mjs --runs 2000 --seed ${{ github.run_number }} --budget 1200

  memory-evidence:
    name: Memory evidence (T-ZERO-04, T-ZERO-06, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Electron's system libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxshmfence1
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox prefers. Keep that block, as on a
      # user's machine, and make chrome-sandbox setuid root as the .deb's after-install does: Chromium then
      # runs the setuid sandbox, whose renderers are non-dumpable (T-ZERO-06 asserts both).
      - name: Electron's setuid sandbox, as the .deb installs it
        # npm ci does not fetch Electron's binary on this runner (it downloads on first launch), so chrome-sandbox
        # does not exist yet: fetch it first.
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build @slate/native (libcrypto, SQLCipher, addon)
        run: |
          npm run -w @slate/native build:openssl -- --only openssl
          npm run -w @slate/native build:sqlcipher
          npm run -w @slate/native build:addon
      - name: Build the app
        run: npm run build -w @slate/desktop
      # memscan reads /proc/<pid>/mem through passwordless sudo; the app runs as this user. A crash must leave no
      # core file although the shell allows one.
      - name: Memory evidence
        working-directory: packages/desktop
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/slate-core.%p
          ulimit -c unlimited
          xvfb-run --auto-servernum npx playwright test --config playwright.linux.config.ts
          test -z "$(ls /tmp/slate-core.* 2>/dev/null)"
        env:
          SLATE_E2E_SHOW: 1
      # Uploaded pass or fail: the report is the evidence (what each scan looked for and found).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memscan-report
          # memscan/report.json, plus Playwright's traces when a step failed.
          path: packages/desktop/test-results/
          if-no-files-found: error
          retention-days: 90
