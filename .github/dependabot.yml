# At most a few pull requests a week: every update in an ecosystem lands in one grouped PR on
# Monday, majors apart. Security fixes for known vulnerabilities come whenever an advisory appears,
# also grouped into one PR. A version must be a week old before Dependabot proposes it, so a
# hijacked release that is pulled within days never reaches a PR.
# Each PR touches a guard file (the root package.json or .github/workflows/), so it is not merged
# on GitHub: take the change in through a branch (CLAUDE.md, Dependabot).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /tools/lint
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Adelaide
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
