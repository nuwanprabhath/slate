appId: dev.slate.notes
productName: Slate
copyright: Copyright © 2026 Nuwan Munasinghe
# package.json holds a range (^45.0.0); electron-builder needs the exact release to download. Keep in step with the lockfile.
electronVersion: 45.0.0
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  icon: build/icons
  category: Office
  maintainer: Nuwan Munasinghe
artifactName: Slate-${version}-${os}-${arch}.${ext}
npmRebuild: true
